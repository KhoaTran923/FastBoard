name: CI/CD

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  # A new push cancels the previous run on the same ref
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11'

jobs:
  # ---------------------------------------------------------------- CI -------
  quality:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit & component tests
        run: pnpm run test

  integration:
    name: API integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fastboard_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fastboard_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-not-used-in-production
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-used-in-production
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm run migrate

      - name: Integration tests (supertest + Postgres)
        run: pnpm run test:integration

  build:
    name: Build (WASM + client + server)
    runs-on: ubuntu-latest
    needs: [quality, integration]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The .wasm files are committed; rebuilding proves the sources still compile
      - name: Build WebAssembly modules
        run: pnpm --filter @repo/wasm run build

      - name: Fail if committed .wasm is stale
        run: git diff --exit-code -- client/public/wasm

      - name: Build server
        run: pnpm --filter @repo/server run build

      - name: Build client
        run: pnpm --filter @repo/client run build

      - name: Upload client bundle
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: client/Dockerfile
          push: false
          build-args: VITE_API_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------- CD -------
  # Secrets cannot be read from job-level `if`, so a tiny job exposes their
  # presence as outputs. Deploy jobs are skipped (not failed) when unconfigured.
  deploy-config:
    name: Check deploy credentials
    runs-on: ubuntu-latest
    needs: [build, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      railway: ${{ steps.check.outputs.railway }}
      render: ${{ steps.check.outputs.render }}
      vercel: ${{ steps.check.outputs.vercel }}
    steps:
      - id: check
        run: |
          echo "railway=${{ secrets.RAILWAY_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
          echo "render=${{ secrets.RENDER_DEPLOY_HOOK != '' }}" >> "$GITHUB_OUTPUT"
          echo "vercel=${{ secrets.VERCEL_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

  deploy-backend-railway:
    name: Deploy backend (Railway)
    runs-on: ubuntu-latest
    needs: deploy-config
    if: needs.deploy-config.outputs.railway == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service ${{ vars.RAILWAY_SERVICE || 'fastboard-server' }} --detach

      - name: Run database migrations
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway run --service ${{ vars.RAILWAY_SERVICE || 'fastboard-server' }} pnpm --filter @repo/server run migrate:prod

  deploy-backend-render:
    name: Deploy backend (Render)
    runs-on: ubuntu-latest
    needs: deploy-config
    # Alternative host: fires only when a Render deploy hook is configured
    if: needs.deploy-config.outputs.render == 'true'
    environment: production
    steps:
      - name: Trigger Render deploy
        run: curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

  deploy-frontend-vercel:
    name: Deploy frontend (Vercel)
    runs-on: ubuntu-latest
    needs: deploy-config
    if: needs.deploy-config.outputs.vercel == 'true'
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # vercel.json runs the WASM + Vite build from the repo root
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  smoke:
    name: Post-deploy smoke test
    runs-on: ubuntu-latest
    needs: [deploy-backend-railway, deploy-frontend-vercel]
    # Runs when at least one deploy ran and none failed
    if: always() && !cancelled() && !contains(needs.*.result, 'failure')
    steps:
      - name: Check API health
        if: vars.PRODUCTION_API_URL != ''
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsSL "${{ vars.PRODUCTION_API_URL }}/health"; then exit 0; fi
            echo "attempt $i failed, retrying in 10s"; sleep 10
          done
          echo "API health check failed"; exit 1
