server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
  gzip_min_length 1024;

  # Hashed filenames: safe to cache forever
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Correct MIME type lets the browser stream-compile the modules
  location /wasm/ {
    types { application/wasm wasm; }
    default_type application/wasm;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The service worker must be revalidated on every load, or clients get stuck
  # on an old precache manifest after a deploy. Must be "no-cache" and NOT
  # "no-store": Chromium refuses to register a worker whose script is no-store.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    types { application/manifest+json webmanifest; }
    default_type application/manifest+json;
  }

  # SPA: every unknown path renders index.html and React Router takes over
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  # The API and websocket live on their own origin in this setup; a same-origin
  # deployment can uncomment these to proxy instead.
  # location /api/      { proxy_pass http://server:3001; }
  # location /socket.io/ {
  #   proxy_pass http://server:3001;
  #   proxy_http_version 1.1;
  #   proxy_set_header Upgrade $http_upgrade;
  #   proxy_set_header Connection "upgrade";
  # }
}
