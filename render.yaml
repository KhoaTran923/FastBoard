# Render Blueprint — alternative backend host to Railway.
# Create from the Render dashboard: New > Blueprint > point at this repo.
# The frontend stays on Vercel; only the API, database, and cache live here.
services:
  - type: web
    name: fastboard-server
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /api/health
    # Migrations run before the new instance takes traffic
    preDeployCommand: node dist/db/migrate.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: fastboard-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: fastboard-cache
          property: connectionString
      # Generated once by Render and kept across deploys
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # Must equal the deployed frontend origin, or the browser is blocked by CORS
      - key: CORS_ORIGIN
        sync: false

  - type: keyvalue
    name: fastboard-cache
    plan: free
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: fastboard-db
    databaseName: fastboard
    user: fastboard
    plan: free
    region: singapore
